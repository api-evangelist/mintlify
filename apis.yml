  - url: https://www.mintlify.com/docs/api/introduction
    type: APIReferenceDocumentation
  description: >-
    Mintlify is a developer documentation platform that helps product and engineering teams create, maintain,
    and host modern docs. It uses a docs‑as‑code workflow (Markdown in your repo) with a rich component
    library and GitHub integration. Mintlify can generate polished API references from OpenAPI/Swagger
    or Postman, add interactive “Try it” requests and dynamic code samples/SDKs, and includes AI tools
    (like its Doc Writer) to draft and update docs from your code.
