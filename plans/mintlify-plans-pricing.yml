specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Mintlify
providerId: mintlify
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Documentation
  - Developer Tools
  - SaaS
  - AI Assistant
description: Mintlify is sold as a tiered SaaS subscription — Hobby (Free), Pro ($250/month), and
  Enterprise (custom). Each tier includes a custom-domain doc site, analytics, and an AI Assistant
  with 5,000 credits per month (overage at $0.01/credit on Hobby and Pro). Pro adds 5 editor seats
  ($20/seat/month for additional), preview deployments, and password protection. Enterprise unlocks
  unlimited seats, agent analytics, self-updating workflows, and dedicated support. Annual billing
  saves up to 15%.
sources:
  - https://mintlify.com/pricing
plans:
  - id: mintlify-hobby
    name: Hobby
    type: freemium
    description: Free plan for solo maintainers; one dashboard member, custom domain, analytics, and
      5,000 monthly AI Assistant credits.
    entries:
      - label: Per-account
        name: hobby_account
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Editor seats
        name: hobby_seats
        type: quota
        metric: seat
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: AI Assistant credits
        name: hobby_ai_credits
        type: quota
        metric: credit
        limit: 5000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: AI Assistant overage
        name: hobby_ai_overage
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.01'
        userMultiplied: false
    elements:
      - name: Custom domain
      - name: Analytics
      - name: One dashboard member
  - id: mintlify-pro
    name: Pro
    type: subscription
    description: Team plan; $250/month flat with 5 editor seats included; $20/month for each additional
      seat. Adds AI Assistant agent, writing agent, preview deployments, and password protection.
    entries:
      - label: Per-month subscription
        name: pro_monthly
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '250.00'
        userMultiplied: false
      - label: Editor seats included
        name: pro_seats_included
        type: quota
        metric: seat
        limit: 5
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Additional editor seat
        name: pro_seats_addon
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '20.00'
        userMultiplied: true
      - label: AI Assistant credits
        name: pro_ai_credits
        type: quota
        metric: credit
        limit: 5000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: AI Assistant overage
        name: pro_ai_overage
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.01'
        userMultiplied: false
    elements:
      - name: Assistant agent
      - name: Writing agent
      - name: Preview deployments
      - name: Password protection
      - name: Custom domain
      - name: Analytics
  - id: mintlify-enterprise
    name: Enterprise
    type: enterprise
    description: Contact-sales tier; unlimited editor seats, custom AI credit allotment, agent
      analytics, self-updating workflows, boosted performance, enterprise security/legal, dedicated
      migration and support.
    entries:
      - label: Custom contract
        name: enterprise_contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Editor seats
        name: enterprise_seats
        type: quota
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
      - label: AI Assistant credits
        name: enterprise_ai_credits
        type: quota
        metric: credit
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Everything in Pro
      - name: Unlimited members
      - name: Agent analytics
      - name: Self-updating workflows
      - name: Boosted performance
      - name: Enterprise security and legal
      - name: Migration and support
  - id: mintlify-annual
    name: Annual Billing
    type: subscription
    description: All paid tiers can be billed annually; Mintlify advertises "save up to 15%" on annual.
    entries:
      - label: Annual discount
        name: annual_discount
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: up to 15% off monthly equivalent
        userMultiplied: false
    elements:
      - name: Discount applied to Pro and Enterprise commitments
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
