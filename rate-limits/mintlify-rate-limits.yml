specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Mintlify
providerId: mintlify
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Documentation
  - Developer Tools
description: Mintlify primarily ships a rendered documentation site and a dashboard / management API.
  Rate limits for the management API are not separately published on the public pricing or docs page;
  the AI Assistant has a per-plan credit budget (5,000/month included on Hobby and Pro, with $0.01
  overage on each credit) which functions as the de-facto rate cap for AI inference. The CDN-served
  documentation site has no documented per-IP request cap.
sources:
  - https://mintlify.com/pricing
  - https://mintlify.com/docs
notes: Per-second / per-minute API rate limits for the Mintlify management API are not publicly
  documented; reconciliation deferred. AI credit allotment captured in the Plans artifact.
responseCodes:
  throttled: 429
limits:
  - name: AI Assistant credits (monthly)
    scope: account
    metric: credit
    limit: 5000
    timeFrame: month
    notes: Hobby and Pro tiers each receive 5,000 included credits/month; overage at $0.01/credit.
      Enterprise customizes.
  - name: Mintlify management API
    scope: account
    metric: varies
    limit: 'Per-account; no public per-second rate limit published'
  - name: Documentation site (CDN)
    scope: IP
    metric: varies
    limit: 'CDN-fronted; no documented per-IP cap'
policies:
  - name: AI credit consumption
    description: Each Assistant query consumes credits at a per-query rate; overage is billed at
      $0.01/credit on Hobby and Pro tiers. Enterprise has a custom allotment.
  - name: Build / preview rate
    description: Pro and Enterprise tiers add preview deployments; build velocity is governed by the
      underlying CI infrastructure rather than a published per-minute limit.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
