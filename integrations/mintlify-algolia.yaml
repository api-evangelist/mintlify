naftiko: 1.0.0-alpha2
info:
  label: Mirror Mintlify search results into Algolia DocSearch
  description: Query the Mintlify discovery search endpoint and forward indexed pages into an Algolia index so dual surfaces stay aligned.
  tags:
  - Mintlify
  - Integration
  - Search
  - algolia
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    MINTLIFY_API_KEY: MINTLIFY_API_KEY
    ALGOLIA_API_KEY: ALGOLIA_API_KEY
capability:
  consumes:
  - type: http
    namespace: mintlify
    baseUri: https://api.mintlify.com
    description: Mintlify API operations consumed by this integration.
    resources:
    - name: discovery-v1-search-domain
      path: /discovery/v1/search/{domain}
      operations:
      - name: searchdocs
        method: GET
        description: Search Mintlify-hosted documentation for a given domain.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: path
          type: string
          description: Path parameter domain.
          required: true
  - type: http
    namespace: algolia
    baseUri: https://{appId}-dsn.algolia.net
    description: Algolia Search API operations consumed by this integration.
    resources:
    - name: 1-indexes-indexname-batch
      path: /1/indexes/{indexName}/batch
      operations:
      - name: batchindex
        method: POST
        description: 'Algolia Search API: batchIndex'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: indexName
          in: path
          type: string
          description: Path parameter indexName.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: 1-indexes-indexname
      path: /1/indexes/{indexName}
      operations:
      - name: getindex
        method: GET
        description: 'Algolia Search API: getIndex'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: indexName
          in: path
          type: string
          description: Path parameter indexName.
          required: true
  exposes:
  - type: mcp
    namespace: mintlify-algolia-mcp
    description: MCP adapter for the mintlify-algolia integration.
    tools:
    - name: mintlify_algolia
      description: Execute the mintlify algolia integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: mintlify-algolia-rest
    port: 8080
    description: REST adapter for the mintlify-algolia integration.
    resources:
    - path: /mintlify-algolia
      name: mintlify-algolia
      description: REST surface for the mintlify-algolia integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the mintlify-algolia integration.
        call: mintlify_algolia
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
