naftiko: 1.0.0-alpha2
info:
  label: Open Mintlify docs jobs from Linear issues
  description: When a Linear issue is labeled docs, create a Mintlify agent job for the affected project and write the job link back to the Linear issue as a comment.
  tags:
  - Mintlify
  - Integration
  - Issue tracking
  - linear
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    MINTLIFY_API_KEY: MINTLIFY_API_KEY
    LINEAR_API_KEY: LINEAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: mintlify
    baseUri: https://api.mintlify.com
    description: Mintlify API operations consumed by this integration.
    resources:
    - name: v1-agent-projectid-job
      path: /v1/agent/{projectId}/job
      operations:
      - name: createagentjob
        method: POST
        description: Create a Mintlify agent job to draft or update documentation.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Path parameter projectId.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-agent-projectid-job-id
      path: /v1/agent/{projectId}/job/{id}
      operations:
      - name: getagentjob
        method: GET
        description: Fetch the status of a Mintlify agent job.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: projectId
          in: path
          type: string
          description: Path parameter projectId.
          required: true
        - name: id
          in: path
          type: string
          description: Path parameter id.
          required: true
  - type: http
    namespace: linear
    baseUri: https://api.linear.app
    description: Linear GraphQL API operations consumed by this integration.
    resources:
    - name: graphql
      path: /graphql
      operations:
      - name: query
        method: POST
        description: 'Linear GraphQL API: query'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: mintlify-linear-mcp
    description: MCP adapter for the mintlify-linear integration.
    tools:
    - name: mintlify_linear
      description: Execute the mintlify linear integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: mintlify-linear-rest
    port: 8080
    description: REST adapter for the mintlify-linear integration.
    resources:
    - path: /mintlify-linear
      name: mintlify-linear
      description: REST surface for the mintlify-linear integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the mintlify-linear integration.
        call: mintlify_linear
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
