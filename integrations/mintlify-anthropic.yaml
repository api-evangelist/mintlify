naftiko: 1.0.0-alpha2
info:
  label: Ground Anthropic Claude in Mintlify docs via RAG
  description: Use the Mintlify discovery search endpoint as a retrieval source, then pass top-ranked snippets into a Claude message for grounded answers.
  tags:
  - Mintlify
  - Integration
  - AI
  - anthropic
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    MINTLIFY_API_KEY: MINTLIFY_API_KEY
    ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: mintlify
    baseUri: https://api.mintlify.com
    description: Mintlify API operations consumed by this integration.
    resources:
    - name: discovery-v1-search-domain
      path: /discovery/v1/search/{domain}
      operations:
      - name: searchdocs
        method: GET
        description: Search Mintlify-hosted documentation for a given domain.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: path
          type: string
          description: Path parameter domain.
          required: true
    - name: discovery-v2-assistant-domain-message
      path: /discovery/v2/assistant/{domain}/message
      operations:
      - name: createassistantmessage
        method: POST
        description: Send a message to the Mintlify-hosted assistant for a domain.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: path
          type: string
          description: Path parameter domain.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  - type: http
    namespace: anthropic
    baseUri: https://api.anthropic.com
    description: Anthropic Messages API operations consumed by this integration.
    resources:
    - name: v1-messages
      path: /v1/messages
      operations:
      - name: createmessage
        method: POST
        description: 'Anthropic Messages API: createMessage'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: mintlify-anthropic-mcp
    description: MCP adapter for the mintlify-anthropic integration.
    tools:
    - name: mintlify_anthropic
      description: Execute the mintlify anthropic integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: mintlify-anthropic-rest
    port: 8080
    description: REST adapter for the mintlify-anthropic integration.
    resources:
    - path: /mintlify-anthropic
      name: mintlify-anthropic
      description: REST surface for the mintlify-anthropic integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the mintlify-anthropic integration.
        call: mintlify_anthropic
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
