naftiko: 1.0.0-alpha2
info:
  label: Power OpenAI assistants with Mintlify docs retrieval
  description: Retrieve relevant documentation snippets from Mintlify and inject them into an OpenAI chat completion as grounding context.
  tags:
  - Mintlify
  - Integration
  - AI
  - openai
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    MINTLIFY_API_KEY: MINTLIFY_API_KEY
    OPENAI_API_KEY: OPENAI_API_KEY
capability:
  consumes:
  - type: http
    namespace: mintlify
    baseUri: https://api.mintlify.com
    description: Mintlify API operations consumed by this integration.
    resources:
    - name: discovery-v1-search-domain
      path: /discovery/v1/search/{domain}
      operations:
      - name: searchdocs
        method: GET
        description: Search Mintlify-hosted documentation for a given domain.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: path
          type: string
          description: Path parameter domain.
          required: true
    - name: discovery-v2-assistant-domain-message
      path: /discovery/v2/assistant/{domain}/message
      operations:
      - name: createassistantmessage
        method: POST
        description: Send a message to the Mintlify-hosted assistant for a domain.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: path
          type: string
          description: Path parameter domain.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  - type: http
    namespace: openai
    baseUri: https://api.openai.com
    description: OpenAI API operations consumed by this integration.
    resources:
    - name: v1-chat-completions
      path: /v1/chat/completions
      operations:
      - name: createchatcompletion
        method: POST
        description: 'OpenAI API: createChatCompletion'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: mcp
    namespace: mintlify-openai-mcp
    description: MCP adapter for the mintlify-openai integration.
    tools:
    - name: mintlify_openai
      description: Execute the mintlify openai integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: mintlify-openai-rest
    port: 8080
    description: REST adapter for the mintlify-openai integration.
    resources:
    - path: /mintlify-openai
      name: mintlify-openai
      description: REST surface for the mintlify-openai integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the mintlify-openai integration.
        call: mintlify_openai
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
