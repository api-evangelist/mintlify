naftiko: 1.0.0-alpha2
info:
  label: A/B test Mintlify docs variants with Statsig
  description: Use Statsig to assign docs visitors to layout / copy experiments, then attribute Mintlify assistant conversations and feedback back to the assigned variant.
  tags:
  - Mintlify
  - Integration
  - Experimentation
  - statsig
  created: '2026-05-20'
  modified: '2026-05-20'
binds:
- namespace: env
  keys:
    MINTLIFY_API_KEY: MINTLIFY_API_KEY
    STATSIG_API_KEY: STATSIG_API_KEY
capability:
  consumes:
  - type: http
    namespace: mintlify
    baseUri: https://api.mintlify.com
    description: Mintlify API operations consumed by this integration.
    resources:
    - name: v1-analytics-conversations
      path: /v1/analytics/conversations
      operations:
      - name: getconversations
        method: GET
        description: List recent Mintlify assistant conversations for analysis.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
    - name: v1-analytics-feedback
      path: /v1/analytics/feedback
      operations:
      - name: getfeedback
        method: GET
        description: List recent user feedback events on Mintlify docs.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters: []
  - type: http
    namespace: statsig
    baseUri: https://api.statsig.com
    description: Statsig Console API operations consumed by this integration.
    resources:
    - name: v1-log-event
      path: /v1/log_event
      operations:
      - name: logevent
        method: POST
        description: 'Statsig Console API: logEvent'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: console-v1-experiments-id
      path: /console/v1/experiments/{id}
      operations:
      - name: getexperiment
        method: GET
        description: 'Statsig Console API: getExperiment'
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: Path parameter id.
          required: true
  exposes:
  - type: mcp
    namespace: mintlify-statsig-mcp
    description: MCP adapter for the mintlify-statsig integration.
    tools:
    - name: mintlify_statsig
      description: Execute the mintlify statsig integration end-to-end.
      inputSchema:
        type: object
        properties:
          trigger_event:
            type: object
            description: Triggering event payload.
        required:
        - trigger_event
  - type: rest
    namespace: mintlify-statsig-rest
    port: 8080
    description: REST adapter for the mintlify-statsig integration.
    resources:
    - path: /mintlify-statsig
      name: mintlify-statsig
      description: REST surface for the mintlify-statsig integration.
      operations:
      - method: POST
        name: trigger
        description: Trigger the mintlify-statsig integration.
        call: mintlify_statsig
        with:
          trigger_event: rest.body
        outputParameters:
        - type: object
          mapping: $.
