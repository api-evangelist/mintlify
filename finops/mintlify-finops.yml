principles:
  - name: Visibility
    description: Pull AI credit consumption from the Mintlify dashboard usage report; reconcile against
      monthly invoice to spot overage.
  - name: Allocation
    description: Tag editor seats to the engineering / docs team that consumes them; allocate AI credit
      cost to the product line whose docs are queried (use Assistant analytics on Enterprise).
  - name: Optimization
    description: Trim unused editor seats — each costs $20/month above the 5 included; cap AI Assistant
      to internal IP ranges or authenticated users to avoid runaway public-traffic credit overage; move
      to annual billing for ~15% savings.
  - name: Accountability
    description: Designate a docs platform owner; review AI credit overage monthly; cap Assistant
      credits via product configuration to prevent surprise charges.
