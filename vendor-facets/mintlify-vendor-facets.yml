earns_nothing:
- feature: sdk-examples
  check: examples_present
  why: >-
    Contract-side examples are counted in the OpenAPI. Mintlify renders the examples a spec already has
    and writes none back; the +10.9pp measured in 2026-09 was the cohort's own specs.
- feature: search-mcp
  check: well_known_published
  why: >-
    The /.well-known/mcp and server-card documents are none of the four files the check reads (api-catalog,
    security.txt, protected-resource, AAuth). Only the api-catalog row earns it.
- feature: page-feedback
  check: support_channel
  why: A feedback widget is not a Support, HelpCenter or Community channel.
- feature: auth-prm
  check: protected_resource_metadata
  layer: agent_readiness
  why: >-
    It describes the documentation site's login, not the API's resource server. If a probe credits it,
    that is a false credit the provider did not earn for its API.
out_of_reach:
  checks:
  - contract_present
  - info_complete
  - operations_description_coverage
  - error_responses_documented
  - sdk_count_1
  - sdk_count_3
  - cli_present
  - postman_present
  - status_page_present
  - rules_present
  note: >-
    Mintlify renders a contract and hosts prose; it does not author OpenAPI, generate SDKs or a CLI, publish
    a Postman collection, run a status page or ship a ruleset.
unscored_practice:
- feature: x-mint
  why: Contract-to-docs pointer inside the OpenAPI; 46 providers ship it and no check reads it.
- feature: markdown-export
  why: >-
    Markdown twins and Accept text/markdown negotiation; the rubric notes markdown negotiation and scores
    it nowhere.
- feature: webmcp
  why: In-browser tool registration via navigator.modelContext; no check reads WebMCP.
- feature: visibility-component
  why: Agent-only content blocks are real agent-facing authoring with no scored signal.
- feature: llms-txt
  why: llms-full.txt and the Link / X-Llms-Txt discovery headers earn nothing beyond the llms.txt row.
